# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

# TODO: Change the workflow name to something more specific
name: DSMT-Day2-CI

# This defines the triggers for the workflow
# i.e. when the workflow will run
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# This defines the permissions for the workflow
permissions:
  contents: read

jobs:
  build:

    # This defines the type of machine to run the job on
    runs-on: ubuntu-latest

    steps:

    # This step copies your repository code to the runner
    - uses: actions/checkout@v4

    # This step sets up Python on the runner
    # TODO: Change the Python version to 3.12
    - name: Set up Python 3.12
      uses: actions/setup-python@v3
      with:
        python-version: "3.12"

    # TODO: Install uv on the runner
    # think about using readme uv step, search for uv workflow on github actions
    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Verify uv installation
      run: uv --version




    # The next steps use *run* to execute commands on the runner
    # This is just like typing commands in the Codespace terminal

    # This step installs dependencies
    # TODO: Replace the run block, using `uv` to sync the environment
    - name: Install dependencies
      run: uv sync --dev

    # This step runs unit tests with pytest
    # TODO: Update the run block. Use: uv run -m pytest
    # (we need -m so that our tests can find our notebook code)
    - name: Test with pytest
      run: uv run -m pytest

    # This step runs the linter against the codebase
    # TODO: Replace the run block to use our preferred linter
    - name: Install Ruff
      run: uv pip install ruff
    

    - name: Lint with Ruff
      run: uv run ruff check . --line-length=127


    # TODO: Add steps to run formatting steps and type checking
    - name: Check formatting with Ruff
      run: uv run ruff format --check .

    - name: Run type checker with ty
      run: |
          uv pip install ty
          uv run ty check .